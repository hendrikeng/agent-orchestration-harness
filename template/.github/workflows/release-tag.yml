name: release-tag

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate release identity
        id: release
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          release_branch="$RELEASE_BRANCH"
          release_title="$RELEASE_TITLE"

          if [[ ! "$release_branch" =~ ^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Release branch must match release/YYYY.MM.DD.N, got: $release_branch" >&2
            exit 1
          fi

          release_version="${release_branch#release/}"
          IFS='.' read -r release_year release_month release_day release_sequence <<< "$release_version"
          parsed_date="$(date -d "$release_year-$release_month-$release_day" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$parsed_date" != "$release_year.$release_month.$release_day" || ! "$release_sequence" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release version must contain a real calendar date and positive sequence, got: $release_version" >&2
            exit 1
          fi

          expected_title="Release $release_version"

          if [[ "$release_title" != "$expected_title" ]]; then
            echo "Release PR title must be '$expected_title', got: $release_title" >&2
            exit 1
          fi

          {
            echo "version=$release_version"
            echo "tag=v$release_version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create annotated release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          source_tag="source-$tag"
          version="$RELEASE_VERSION"
          merge_sha="$MERGE_SHA"
          source_sha="$SOURCE_SHA"

          for candidate in "$tag" "$source_tag"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$candidate" >/dev/null 2>&1; then
              echo "Tag already exists: $candidate" >&2
              exit 1
            fi
          done
          git fetch --no-tags origin "$source_sha"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" "$merge_sha" -m "Release $version" -m "Source-Tag: $source_tag"
          git tag -a "$source_tag" "$source_sha" -m "Release $version source boundary"
          git push --atomic origin "refs/tags/$tag" "refs/tags/$source_tag"
